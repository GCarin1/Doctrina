# Reusable composite action: run the Doctrina gates in CI.
#
#   - uses: GCarin1/Doctrina@main        # or a released tag
#     with:
#       strict: "true"                   # coverage/trace as hard gates
#
# GENERATED by `doctrina ci --emit github` from SEQUENCES.ci in
# packages/doctrina-cli/src/lib/gates.js — the one declaration `close` and
# `doctor` also read. Edit the declaration, re-emit, and commit; a drift
# test fails when this file and the declaration disagree.
#
# The gates: validate (schema/structure), index rebuild --check (index ↔
# tree drift), contract check (the declared runtime surface, RT01-RT05),
# coverage (acceptance-criteria evidence), trace (intent provenance),
# context (the pack budget, ADR 0022).
#
# `run-prefix` exists so this repository can dogfood the action against its
# own working tree instead of the published package.
name: "Doctrina gates"
description: "Run the Doctrina gates (validate, index drift, contract check, coverage, trace, context budget) against a project's .doctrina/ tree."
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  strict:
    description: "Run coverage and trace with --strict (fail on any gap). Set to 'false' for report-only."
    required: false
    default: "true"
  version:
    description: "doctrina-cli version to run via npx (ignored when run-prefix is set)."
    required: false
    default: "latest"
  working-directory:
    description: "Directory holding the .doctrina/ tree."
    required: false
    default: "."
  run-prefix:
    description: "Override the command used to invoke the CLI (e.g. 'node packages/doctrina-cli/src/index.js' for this repo's own CI)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Resolve CLI invocation
      id: cli
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        PREFIX="${{ inputs.run-prefix }}"
        if [ -z "$PREFIX" ]; then PREFIX="npx --yes doctrina-cli@${{ inputs.version }}"; fi
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

    - name: doctrina validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ steps.cli.outputs.prefix }} validate

    - name: doctrina index rebuild --check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ steps.cli.outputs.prefix }} index rebuild --check

    # The runtime gate (RT01-RT05). Every other step reads Markdown; this one
    # reads what the Markdown CLAIMS about the running system and holds the
    # implementation to it — the variable no workflow exports, the default an
    # empty CI value never triggers, the unvalidated enum, the selector that
    # matches nothing and still exits 0. Not gated on `strict`: a declaration
    # that does not hold is an error at any adoption stage. A project with no
    # contracts prints one line and exits 0.
    - name: doctrina contract check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ steps.cli.outputs.prefix }} contract check

    - name: doctrina coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.strict }}" = "true" ]; then
          ${{ steps.cli.outputs.prefix }} coverage --strict
        else
          ${{ steps.cli.outputs.prefix }} coverage
        fi

    - name: doctrina trace
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.strict }}" = "true" ]; then
          ${{ steps.cli.outputs.prefix }} trace --strict
        else
          ${{ steps.cli.outputs.prefix }} trace
        fi

    # The context budget (ADR 0022). A pack that degrades to fit is fine; this
    # fails only when a pack's irreducible core no longer fits at all, which
    # means a spec has outgrown itself or a change has gone stale. Configure
    # the ceiling per project with "context_budget": n in
    # .doctrina/config.json.
    - name: doctrina context (budget)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        ${{ steps.cli.outputs.prefix }} context >/dev/null
        for cap in $(ls .doctrina/specs 2>/dev/null); do
          ${{ steps.cli.outputs.prefix }} context "$cap" >/dev/null
        done

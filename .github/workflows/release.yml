name: Release

# A RELEASE IS A VERSION THAT REACHED main, NOT A TAG SOMEBODY PUSHED.
#
# The tag used to be the trigger, and the tag was made by hand. v0.20.0 went
# on a later merge while 0.20.0 was already on npm (every gate passed and the
# publish was refused with a 403), and v0.21.0 went on a commit whose
# examples were still stamped 0.20.0. Both were the same mistake: a person
# deciding, after the merge, which commit a version is.
#
# The version is `packages/doctrina-cli/package.json`'s. When a push to main
# carries one npm does not have yet, this job runs the gates, publishes it,
# and tags that commit `vX.Y.Z` itself. Any other push to main ends at the
# first step.
#
# A TAG IS NOT A TRIGGER (change 0262). The tag is this job's output: the
# run a tag push started asked npm, seconds after the publish, whether the
# version was there — npm was still processing it — and published it again,
# which npm refused with E409. 0.22.0 went out with a red run beside it.
#
# A VERSION NPM HOLDS IS NOT A FAILURE. npm now stages a publish made with a
# token that bypasses 2FA until a maintainer approves it with 2FA, and stops
# such tokens from publishing directly in 2027. The job says when the version
# it published is not public yet, and how to approve it; with trusted
# publishing configured on npmjs.com (this workflow file, `npm publish`
# allowed) npm authenticates through OIDC and nothing is staged.
on:
  push:
    branches: [main]
    paths:
      - packages/doctrina-cli/package.json
  workflow_dispatch:

permissions:
  contents: write   # the job pushes the tag
  id-token: write   # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      # The whole history: the step below asks whether this commit is on main.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The ACTIVE LTS the CI matrix already tests on three operating
      # systems. This job published from 20.12 — end of life since April
      # 2026 — which is the floor `engines` declares, not a release toolchain.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Is there anything to publish? A tag must name the version
      # package.json declares; a version npm already has is never replaced.
      - name: Is this version on npm yet?
        id: plan
        shell: bash
        run: |
          version=$(node -p "require('./packages/doctrina-cli/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Only what is on main is released. `workflow_dispatch` can be run
          # on any branch and a tag can be pushed on any commit: either would
          # have published code no pull request had merged.
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::the release runs from main, not from ${GITHUB_REF_NAME} — merge the version bump, and the release follows"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_SHA} is not on main — a release is a version that reached main"
            exit 1
          fi
          # A manual run started on a tag publishes nothing: the tag is what a
          # release leaves behind, never what makes one.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::notice::${GITHUB_REF_NAME} is a tag — a release is a version bump merged into main (node scripts/release.mjs <X.Y.Z>); nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published=$(npm view "doctrina-cli@${version}" version 2>/dev/null || true)
          if [ -n "${published}" ]; then
            echo "::notice::doctrina-cli@${version} is already on npm — nothing to publish. A release is a version bump merged into main (node scripts/release.mjs <X.Y.Z>)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::doctrina-cli@${version} is not on npm yet — publishing it"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing (OIDC) needs npm 11.5.1 or later. Node 24 ships a
      # recent npm; this only acts on a runner image that does not.
      - name: npm can publish through trusted publishing
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |
          have=$(npm --version)
          if node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "${have}"; then
            echo "npm ${have}"
          else
            echo "npm ${have} is older than 11.5.1 — upgrading for trusted publishing"
            npm install -g npm@11
          fi

      # The CLI ships zero RUNTIME dependencies, so this job never installed
      # anything. The typecheck gate needs TypeScript (a devDependency), and
      # a release is the last place to be running a weakened gate.
      - name: Install devDependencies
        if: steps.plan.outputs.publish == 'true'
        run: npm ci

      # Every place that quotes the version agrees with it: the lockfile, the
      # READMEs, SECURITY.md, AGENTS.md, the changelog heading, the root index
      # and each example's. Asked FIRST, in seconds — the examples' stamp was
      # found by the strict validate four gates and two minutes later.
      - name: Every stamp quotes the version
        if: steps.plan.outputs.publish == 'true'
        run: node scripts/release.mjs --check

      # THE RELEASE GATE IS NOT WEAKER THAN THE PR GATE.
      #
      # This job used to run typecheck, the test suite and `validate`, and
      # stop there — a strict subset of what every pull request already
      # survives. A release is the last moment a defect is cheap, so it was
      # the wrong place to be running the thinnest gate in the repository.
      #
      # `verify` executes the eight checks declared in .doctrina/verify.json,
      # which is the same list the gates action runs, so this stays one
      # declaration rather than a second copy that drifts.
      - name: Doctrina verify (the declared build gate)
        if: steps.plan.outputs.publish == 'true'
        run: node packages/doctrina-cli/src/index.js verify

      # The one gate that exercises what npm actually ships. Three defects
      # (C1, C2, C5) were invisible from a source checkout and obvious from a
      # packed install, and a publish is precisely where that class lands on
      # users instead of on us.
      - name: Packed-install harness (what the tarball really does)
        if: steps.plan.outputs.publish == 'true'
        run: node scripts/e2e-packed.mjs

      # The examples ship in the repository, not in the tarball, but a release
      # is what people go read them at. Strict: a warning in an example is a
      # defect (change 0126).
      - name: Examples validate (strict)
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |
          for dir in examples/*/; do
            [ -d "$dir/.doctrina" ] || continue
            echo "──── $dir"
            ( cd "$dir" && node ../../packages/doctrina-cli/src/index.js validate --strict )
          done

      # `--provenance` is why this job asks for `id-token: write`. Without the
      # flag the permission was granted and spent on nothing; with it, npm
      # publishes a signed attestation tying the tarball to this workflow run
      # and this commit, which is the supply-chain claim a zero-dependency
      # tool should be able to make.
      #
      # With a trusted publisher configured for this workflow on npmjs.com,
      # npm authenticates through OIDC before it falls back to the token, and
      # the version goes out at once. With the token alone npm may stage it.
      - name: Publish doctrina-cli
        id: publish
        if: steps.plan.outputs.publish == 'true'
        working-directory: packages/doctrina-cli
        shell: bash
        run: |
          set +e
          npm publish --access public --provenance 2>&1 | tee "${RUNNER_TEMP}/publish.log"
          code=${PIPESTATUS[0]}
          set -e
          # A version npm already holds, staged by an earlier attempt, is the
          # maintainer's to approve — publishing it again cannot succeed.
          if [ "${code}" -ne 0 ] && grep -q "previously staged version" "${RUNNER_TEMP}/publish.log"; then
            echo "::warning::npm already holds doctrina-cli@${{ steps.plan.outputs.version }} staged, waiting for a maintainer's approval with 2FA: npmjs.com → your account → Staged Packages → Approve (or: npm stage list doctrina-cli, then npm stage approve <stage-id>)"
            exit 0
          fi
          exit "${code}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm can accept a version and hold it (staged) until a maintainer
      # approves it. The run says so, instead of reporting a release that
      # nobody can install yet.
      - name: Is the published version public?
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |
          version="${{ steps.plan.outputs.version }}"
          for attempt in 1 2 3 4 5 6; do
            if [ -n "$(npm view "doctrina-cli@${version}" version 2>/dev/null || true)" ]; then
              echo "::notice::doctrina-cli@${version} is public on npm"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::doctrina-cli@${version} was accepted but is not public after two minutes — npm may be holding it staged until a maintainer approves it with 2FA: npmjs.com → your account → Staged Packages → Approve (or: npm stage list doctrina-cli, then npm stage approve <stage-id>). Trusted publishing for this workflow, configured on npmjs.com, publishes without staging."

      # The tag names the commit that was published, because the job that
      # published it is the one that writes it. A tag that is already there
      # (pushed by hand, which is what triggered this run) is left alone.
      - name: Tag the published commit
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |
          tag="v${{ steps.plan.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists — left as it is"
          else
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "${tag}"
            echo "::notice::tagged ${GITHUB_SHA} as ${tag}"
          fi

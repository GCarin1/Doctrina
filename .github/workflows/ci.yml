name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + self-validate (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20.12", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The CLI has zero RUNTIME dependencies, so this repo went years with
      # no install step in CI. The typecheck needs TypeScript, which is a
      # devDependency — install it from the lockfile, deterministically.
      - name: Install devDependencies
        run: npm ci

      # TypeScript as a CHECKER, never a build step (audit item M5): the CLI
      # still ships plain ESM that node runs directly, and `noEmit` keeps it
      # that way. This catches the class of typo a test suite only finds when
      # it happens to execute the branch.
      #
      # `npm run`, never `npx`. With no local TypeScript, `npx tsc` FETCHES an
      # unrelated abandoned package named `tsc` from the registry and runs it
      # — which is how this step first shipped, and is a supply-chain hole in
      # a tool whose contract is "no network calls". `npm run` resolves only
      # from node_modules/.bin, so a missing dependency fails loudly instead.
      - name: Typecheck (tsc --noEmit over checkJs)
        run: npm run typecheck

      - name: Run CLI test suite
        run: node --test
        working-directory: packages/doctrina-cli

      - name: Self-validate (doctrina validate against own .doctrina/)
        run: node packages/doctrina-cli/src/index.js validate

      - name: Index drift gate (doctrina index rebuild --check)
        run: node packages/doctrina-cli/src/index.js index rebuild --check

      # The shipped examples are documentation that happens to be executable
      # (audit item D5). Both had rotted to two errors each — indexes written
      # by 0.10.0, and an EARS state-driven requirement in the retrofit
      # example that stated its invariant as a fact instead of a `shall`,
      # which is precisely the mistake the example exists to teach against.
      - name: Examples validate against the installed CLI
        shell: bash
        run: |
          for dir in examples/*/; do
            [ -d "$dir/.doctrina" ] || continue
            echo "──── $dir"
            ( cd "$dir" && node ../../packages/doctrina-cli/src/index.js validate )
          done

      # The context budget is a gate, not a report (ADR 0022). It fails when
      # a pack's irreducible core — root rules, product truth, the capability
      # spec, open changes — no longer fits, which is the signal that a spec
      # has outgrown itself or a change has gone stale. The packs that merely
      # degrade to fit stay green; this catches the ones that cannot.
      - name: Context budget gate (every capability pack fits)
        shell: bash
        run: |
          node packages/doctrina-cli/src/index.js context >/dev/null
          for cap in $(ls .doctrina/specs); do
            node packages/doctrina-cli/src/index.js context "$cap" >/dev/null
          done

  e2e:
    name: End-to-end (packed install, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows at minimum: path handling is a plausible failure
        # the in-repo suite cannot see, because it never installs the package.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Packs the tarball, installs it OUTSIDE the repo, and drives a real
      # project through the whole lifecycle with the installed binary. Three
      # audit defects (C1, C2, C5) were invisible from a source checkout and
      # obvious from a packed install.
      - name: Run the packed-install harness
        run: node scripts/e2e-packed.mjs

  gates:
    name: Doctrina gates (own action, strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Dogfood the published composite action against this repository's own
      # tree, pointed at the working-tree CLI instead of the npm package.
      - name: Run the Doctrina gates action
        uses: ./
        with:
          strict: "true"
          run-prefix: node packages/doctrina-cli/src/index.js

# The CLI ships zero runtime dependencies; what moves here is the toolchain
# around it — the two devDependencies of the typecheck and the actions the
# workflows run. Monthly and grouped: one pull request each, not one per bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
    # A TypeScript major is not a routine bump: 7.0 (the native compiler)
    # reports 172 errors over the same checkJs tree that 5.9 accepts, and its
    # grouped pull request turned every typecheck job red. Move to a new major
    # in its own change, with the code made to pass it first.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
